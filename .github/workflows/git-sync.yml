name: Sync to GitLab
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync with GitLab
        uses: iamvikshan/gitsync@774ee24e5f86082edbff140e860bdc36940bb1f9 # v1.1.3
        with:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_PAT: ${{ secrets.GH_TOKEN }}
